name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, before the Kubb registry bumps pins: catches breaking changes in the latest Kubb release.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package

  latest-kubb:
    name: Check against the latest Kubb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D kubb@latest @kubb/adapter-oas@latest && pnpm add @kubb/kit@latest @kubb/renderer-jsx@latest @kubb/plugin-ts@latest
      - run: pnpm list kubb @kubb/kit @kubb/plugin-ts
      - run: pnpm typecheck
      - run: pnpm test
